name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build, unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers (PostgreSQL 17, Kafka, Redis) runs on the runner's
      # Docker daemon. These are the same tests as local: schema invariants,
      # 1000-transfer concurrency storm, deadlock recovery, idempotency
      # races, outbox with a paused broker, Redis outage, fraud verdicts.
      - name: Verify (unit + integration)
        run: mvn -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  docker-image:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t ledgerflow:${{ github.sha }} .

  terraform-validate:
    name: Terraform reference stack validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: fmt + validate (no cloud credentials involved)
        working-directory: deploy/terraform/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  helm-lint:
    name: Helm chart lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint + template
        run: |
          helm lint deploy/k8s/ledgerflow
          helm template smoke deploy/k8s/ledgerflow > /dev/null
