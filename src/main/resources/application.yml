spring:
  application:
    name: ledgerflow
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:ledgerflow}
    username: ${POSTGRES_USER:ledgerflow}
    password: ${POSTGRES_PASSWORD:ledgerflow_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast rather than queue forever when the pool is exhausted (see docs/failure-handling.md)
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Fail sends fast when the broker is down; the outbox retries with
        # backoff instead of buffering forever in the producer.
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        max.block.ms: 3000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,flyway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

ledgerflow:
  ratelimit:
    money-requests-per-minute: ${RATE_LIMIT_MONEY_PER_MINUTE:30}
  fraud:
    large-amount: 100000      # $1,000.00 in minor units
    very-large-amount: 500000 # $5,000.00
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: 100
    max-attempts: 10
    send-timeout-ms: 5000
  security:
    # Dev-only default. Overridden by env in every non-local environment;
    # Kubernetes provides it from a Secret (see deploy/).
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
