spring:
  application:
    name: ledgerflow
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:ledgerflow}
    username: ${POSTGRES_USER:ledgerflow}
    password: ${POSTGRES_PASSWORD:ledgerflow_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast rather than queue forever when the pool is exhausted (see docs/failure-handling.md)
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,flyway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

ledgerflow:
  security:
    # Dev-only default. Overridden by env in every non-local environment;
    # Kubernetes provides it from a Secret (see deploy/).
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
