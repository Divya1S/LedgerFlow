# Docker Engine 29 raised the minimum supported API version to 1.44, while the
# docker-java bundled with Testcontainers 1.x still pins 1.32 and gets a 400
# on every call. Pinning 1.44 here is the documented 1.x workaround; remove
# once Spring Boot manages Testcontainers 2.x, which negotiates automatically.
# https://github.com/testcontainers/testcontainers-java/issues/11212
api.version=1.44
